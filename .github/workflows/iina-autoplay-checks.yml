name: IINA autoplay checks

on:
  push:
    branches:
      - feature/iina-next-episode-autoplay
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-branch:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/iina-next-episode-autoplay
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: |
          corepack enable
          corepack prepare yarn@4 --activate
      - run: yarn install --immutable
      - name: Apply and commit Prettier changes
        run: |
          yarn prettier --write src/modules/windowManager.js src/plugin.js tests/iinaAutoplay.test.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/windowManager.js src/plugin.js tests/iinaAutoplay.test.js
          if ! git diff --cached --quiet; then
            git commit -m "style: format IINA autoplay integration"
            git push origin HEAD:feature/iina-next-episode-autoplay
          fi

  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: |
          corepack enable
          corepack prepare yarn@4 --activate
      - run: yarn install --immutable
      - run: yarn test
      - run: yarn lint

  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: |
          corepack enable
          corepack prepare yarn@4 --activate
      - run: yarn install --immutable
      - run: yarn test
      - run: yarn build-mac
      - name: Upload test build (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: iina-autoplay-macos-dmg
          path: dist/*.dmg
          if-no-files-found: error
